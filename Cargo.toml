[workspace]
members = [
    "crates/protocol",
    "crates/zcash",
    "crates/proofs",
    "crates/chains",
    "crates/threshold",
    "crates/runtime",
]
exclude = ["contracts/solana", "contracts/near", "vendor/libp2p-kad", "vendor/quickcheck-ext"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
primitive-types = "=0.12.2"
sha2 = { version = "=0.10.9", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

# Keep local builds small; dependency caches remain reusable without incremental state.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[patch.crates-io]
libp2p-kad = { path = "vendor/libp2p-kad" }
