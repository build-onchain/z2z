[package]
name = "ziquid-preparation-guest"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
sp1-zkvm = "=6.8.1"
pczt = { version = "=0.9.3", default-features = false, features = ["std", "orchard", "io-finalizer"] }
orchard = { version = "=0.15.5", default-features = false, features = ["std"] }
zcash_note_encryption = "=0.4.2"
zcash_primitives = { version = "=0.30.1", default-features = false, features = ["std"] }
zcash_protocol = { version = "=0.10.5", default-features = false, features = ["std"] }
ziquid-protocol = { path = "../../../protocol" }
sha2 = "=0.10.9"
blake2b_simd = "=1.0.4"
zeroize = "=1.9.0"

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
