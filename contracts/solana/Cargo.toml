[workspace]
members = ["program", "harness", "interface"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

# Keep host harness builds small without changing the SBF release profile.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false
